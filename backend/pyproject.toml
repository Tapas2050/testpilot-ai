[project]
name = "backend"
version = "0.1.0"
description = "TestPilot AI Backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.11",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.8.1",
    "sqlalchemy==2.0.38",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "redis==5.2.1",
    "pyjwt==2.10.1",
    "argon2-cffi==23.1.0",
    "email-validator==2.2.0",
    "cryptography==44.0.2",
    "pymupdf==1.25.3",
    "python-multipart==0.0.20",
    "pgvector==0.3.6",
    "sentence-transformers>=6.1.0",
    "langgraph>=1.2.14",
    "arq>=0.28.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg-binary>=3.3.6",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
    "ruff==0.9.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "eval: live evaluation tests with live LLM calls",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
