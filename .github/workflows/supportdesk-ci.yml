name: SupportDesk Target CI

on:
  push:
    branches: [ master, main ]
    paths:
      - 'supportdesk/**'
      - '.github/workflows/supportdesk-ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'supportdesk/**'
      - '.github/workflows/supportdesk-ci.yml'

jobs:
  test:
    name: SupportDesk Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd supportdesk
          uv sync --frozen || uv sync

      - name: Run SupportDesk Pytest Suite
        run: |
          cd supportdesk
          uv run pytest -v
