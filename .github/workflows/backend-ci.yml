name: Backend CI

on:
  push:
    branches: [ master, main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/testpilot
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/testpilot_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-jwt-secret-testing-minimum-32-characters-required
      ENCRYPTION_KEY: dXNlci1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcy1iYXNlNjQ=
      GEMINI_API_KEY: dummy-ci-gemini-key
      ROOT_DIR: ${{ github.workspace }}
      STORAGE_DIR: ${{ github.workspace }}/storage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          uv sync --frozen || uv sync

      - name: Create test database & vector extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d testpilot -c "CREATE DATABASE testpilot_test;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d testpilot -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d testpilot_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run Alembic migrations
        run: |
          cd backend
          uv run alembic upgrade head

      - name: Run Ruff Linter
        run: |
          cd backend
          uv run ruff check .

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          uv run pytest -m "not eval" -v
